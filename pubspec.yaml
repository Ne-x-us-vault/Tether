name: lovit
description: "A private, realtime couples app for chat, calendar, tasks, budgets, cycle tracking, location sharing, and video calls."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.2.1

  # ── Firebase / Push Notifications ────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.2.2
  battery_plus: ^7.0.0
  pedometer: ^4.2.0
  app_usage: ^4.1.0
  table_calendar: ^3.1.2

  # ── Chat features ────────────────────────────────────────────────────────
  image_picker: ^1.1.2          # Photos & videos from gallery
  image_cropper: ^8.0.0         # Image cropping for avatars
  camera: ^0.11.0+2             # In-app camera
  file_picker: ^11.0.0          # Pick pdfs and files
  record: ^6.1.1                # Voice notes recording
  signature: ^5.0.0             # Drawing / doodles canvas
  jitsi_meet_flutter_sdk: ^12.1.3 # In-app video conferences
  url_launcher: ^6.3.2          # Open links and external apps
  permission_handler: ^11.3.0    # Runtime permissions (mic, camera, storage)
  path_provider: ^2.1.3         # File paths for voice note temp storage
  uuid: ^4.4.0
  intl: ^0.19.0                 # Date formatting in chat
  collection: ^1.19.1
  flutter_riverpod: ^2.5.0      # State management
  supabase_flutter: ^2.10.3
  geolocator: ^13.0.4
  workmanager: ^0.9.0+3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  http: ^1.2.2
  connectivity_plus: ^7.1.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_spinkit: ^5.2.2

  # ── End-to-end encryption ─────────────────────────────────────────────────
  cryptography: ^2.7.0             # X25519 key exchange + AES-256-GCM

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo_lovit.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/memories/

flutter_native_splash:
  color: "#09080E"
  image: assets/images/splash.png
  android: true
  android_12:
    color: "#09080E"
    image: assets/images/splash.png
    icon_background_color: "#FFFFFF"
